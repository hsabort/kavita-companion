# Kavita + kavita-companion behind Caddy (HTTPS). Every setting comes from .env;
# run ./setup.sh to create it. See README.md and docs/.
name: ${COMPOSE_PROJECT_NAME:-kavita}

# Docker's default json-file logs grow without limit; cap each container at 5 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  kavita:
    image: lscr.io/linuxserver/kavita:${KAVITA_IMAGE_TAG}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT:-./data}/kavita:/config
      # Libraries are read-only for Kavita; only kavita-companion writes to them.
      - ${MEDIA_ROOT}/manga:/data/manga:ro
      - ${MEDIA_ROOT}/comics:/data/comics:ro
      - ${MEDIA_ROOT}/books:/data/books:ro
    ports:
      # Plain HTTP for local admin tools (scripts/, tests/) only. Bound to the compose network's
      # gateway, not 127.0.0.1/0.0.0.0, so it is never reachable from outside (docs/security.md).
      - "${DOCKER_GATEWAY}:${KAVITA_LOCAL_PORT}:5000"
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:${CADDY_IMAGE_TAG}
    user: "${PUID}:${PGID}"
    depends_on:
      - kavita
    environment:
      - DOMAIN=${DOMAIN}
      - KAVITA_HTTPS_PORT=${KAVITA_HTTPS_PORT}
      - COMPANION_HTTPS_PORT=${COMPANION_HTTPS_PORT}
      - DOCKER_GATEWAY=${DOCKER_GATEWAY}
    ports:
      - "${PUBLISH_ADDRESS:-0.0.0.0}:${ACME_HTTP_PORT}:8080"                      # Let's Encrypt HTTP-01 checks
      - "${PUBLISH_ADDRESS:-0.0.0.0}:${COMPANION_HTTPS_PORT}:${COMPANION_HTTPS_PORT}" # HTTPS: kavita-companion
      - "${PUBLISH_ADDRESS:-0.0.0.0}:${KAVITA_HTTPS_PORT}:${KAVITA_HTTPS_PORT}"       # HTTPS: Kavita
    volumes:
      - ./caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-./data}/caddy/data:/data
      - ${DATA_ROOT:-./data}/caddy/config:/config
    restart: unless-stopped
    logging: *logging
    # Hardening: no privilege escalation, read-only root filesystem, only the one capability the
    # caddy binary carries as a file capability (exec fails if it is dropped).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

  # Upload portal. Not published: reached only through Caddy.
  kavita-companion:
    # Built from source unless COMPANION_IMAGE names a prebuilt image to run instead
    # (e.g. ghcr.io/hsabort/kavita-companion:0.2.1; see docs/operations.md).
    build:
      # The context is the repository root so the Dockerfile can copy LICENSE and NOTICE.md from
      # their single source of truth (see kavita-companion/Dockerfile).
      context: .
      dockerfile: kavita-companion/Dockerfile
    image: ${COMPANION_IMAGE:-kavita-companion:local}
    user: "${PUID}:${PGID}"
    depends_on:
      - kavita
    environment:
      - TZ=${TZ}
      - KAVITA_URL=http://kavita:5000
      - KAVITA_AUTH_KEY=${COMPANION_KAVITA_AUTH_KEY}
      - COMPANION_SECRET=${COMPANION_SECRET:-}
      - PUBLIC_ORIGIN=https://${DOMAIN}:${COMPANION_HTTPS_PORT}
      - KAVITA_PUBLIC_URL=https://${DOMAIN}:${KAVITA_HTTPS_PORT}
      - TRUSTED_PROXY=${DOCKER_SUBNET}
      - MAX_FILE_GB=${MAX_FILE_GB:-8}
      - MAX_PENDING_GB_PER_USER=${MAX_PENDING_GB_PER_USER:-50}
      - MAX_CONCURRENT_UPLOADS_PER_USER=${MAX_CONCURRENT_UPLOADS_PER_USER:-3}
      - MIN_FREE_DISK_GB=${MIN_FREE_DISK_GB:-25}
      - NOTIFY_ALLOW_PRIVATE=${NOTIFY_ALLOW_PRIVATE:-false}
      - ROLE_RECHECK_MS=${ROLE_RECHECK_MS:-120000}
      # External metadata providers (phase 2). Off by default; an admin enables a provider in the UI.
      - METADATA_EXTERNAL_ENABLED=${METADATA_EXTERNAL_ENABLED:-false}
      - PROVIDERS_ALLOW_PRIVATE=${PROVIDERS_ALLOW_PRIVATE:-false}
      - PROVIDERS_STUB=${PROVIDERS_STUB:-false}
      - PROVIDER_STUB_ENABLED=${PROVIDER_STUB_ENABLED:-false}
      - PROVIDER_STUB_BASE=${PROVIDER_STUB_BASE:-}
      - PROVIDER_STUB_KEY=${PROVIDER_STUB_KEY:-}
      - PROVIDER_HTTP_TIMEOUT_MS=${PROVIDER_HTTP_TIMEOUT_MS:-8000}
      - PROVIDER_HTTP_RETRIES=${PROVIDER_HTTP_RETRIES:-2}
      - PROVIDER_HTTP_BACKOFF_MS=${PROVIDER_HTTP_BACKOFF_MS:-500}
      - PROVIDER_HTTP_MAX_BYTES=${PROVIDER_HTTP_MAX_BYTES:-2097152}
      - PROVIDER_CACHE_TTL_DAYS=${PROVIDER_CACHE_TTL_DAYS:-30}
      - PROVIDER_CACHE_TTL_MS=${PROVIDER_CACHE_TTL_MS:-0}
      # Metron (comics): off until enabled; a per-install bearer token; fixed HTTPS base (test fake).
      - PROVIDER_METRON_BASE=${PROVIDER_METRON_BASE:-}
      - PROVIDER_METRON_KEY=${PROVIDER_METRON_KEY:-}
      - PROVIDER_METRON_ENABLED=${PROVIDER_METRON_ENABLED:-false}
      # Grand Comics Database (comics fallback): keyless; an optional user:pass account key raises the
      # anonymous 30/hour limit to 2,000/day. Fixed HTTPS base (test fake).
      - PROVIDER_GCD_BASE=${PROVIDER_GCD_BASE:-}
      - PROVIDER_GCD_KEY=${PROVIDER_GCD_KEY:-}
      - PROVIDER_GCD_ENABLED=${PROVIDER_GCD_ENABLED:-false}
      - PROVIDER_GCD_MIN_INTERVAL_MS=${PROVIDER_GCD_MIN_INTERVAL_MS:-120000}
      - PROVIDER_GCD_MIN_INTERVAL_MS_AUTHED=${PROVIDER_GCD_MIN_INTERVAL_MS_AUTHED:-5000}
      # MangaDex (manga primary): keyless, credit required, no ads/paid use; covers never fetched.
      # ~5 req/s per IP -> a 250 ms spacing. Fixed HTTPS base (test fake).
      - PROVIDER_MANGADEX_BASE=${PROVIDER_MANGADEX_BASE:-}
      - PROVIDER_MANGADEX_ENABLED=${PROVIDER_MANGADEX_ENABLED:-false}
      - PROVIDER_MANGADEX_MIN_INTERVAL_MS=${PROVIDER_MANGADEX_MIN_INTERVAL_MS:-250}
      - PROVIDER_MANGADEX_CACHE_TTL_DAYS=${PROVIDER_MANGADEX_CACHE_TTL_DAYS:-7}
      # AniList (manga/light novels fallback): keyless GraphQL; strict no-storage terms -> short TTL.
      # 90/min documented but degraded to 30/min -> a 2 s spacing. Fixed HTTPS base (test fake).
      - PROVIDER_ANILIST_BASE=${PROVIDER_ANILIST_BASE:-}
      - PROVIDER_ANILIST_ENABLED=${PROVIDER_ANILIST_ENABLED:-false}
      - PROVIDER_ANILIST_MIN_INTERVAL_MS=${PROVIDER_ANILIST_MIN_INTERVAL_MS:-2000}
      - PROVIDER_ANILIST_CACHE_TTL_DAYS=${PROVIDER_ANILIST_CACHE_TTL_DAYS:-3}
      # Hardcover (books primary): keyed GraphQL (a free per-install personal access token); covers
      # never fetched. The base includes the endpoint path. 60/min -> a 1 s spacing (test fake).
      - PROVIDER_HARDCOVER_BASE=${PROVIDER_HARDCOVER_BASE:-}
      - PROVIDER_HARDCOVER_KEY=${PROVIDER_HARDCOVER_KEY:-}
      - PROVIDER_HARDCOVER_ENABLED=${PROVIDER_HARDCOVER_ENABLED:-false}
      - PROVIDER_HARDCOVER_MIN_INTERVAL_MS=${PROVIDER_HARDCOVER_MIN_INTERVAL_MS:-1000}
      - PROVIDER_HARDCOVER_CACHE_TTL_DAYS=${PROVIDER_HARDCOVER_CACHE_TTL_DAYS:-30}
      # Open Library (books fallback): keyless REST, truthful User-Agent required; covers never fetched.
      # 1 request/s anonymous -> a 1 s spacing. Fixed HTTPS base (test fake).
      - PROVIDER_OPENLIBRARY_BASE=${PROVIDER_OPENLIBRARY_BASE:-}
      - PROVIDER_OPENLIBRARY_ENABLED=${PROVIDER_OPENLIBRARY_ENABLED:-false}
      - PROVIDER_OPENLIBRARY_MIN_INTERVAL_MS=${PROVIDER_OPENLIBRARY_MIN_INTERVAL_MS:-1000}
      - PROVIDER_OPENLIBRARY_CACHE_TTL_DAYS=${PROVIDER_OPENLIBRARY_CACHE_TTL_DAYS:-30}
    volumes:
      - ${DATA_ROOT:-./data}/companion:/data
      # Read-write: approved uploads are moved into the library folders. Upload staging lives in
      # ${MEDIA_ROOT}/.incoming, which Kavita can't see (it mounts only manga/comics/books).
      - ${MEDIA_ROOT}:/media
    restart: unless-stopped
    logging: *logging
    # Hardening: no privilege escalation, no Linux capabilities, read-only root filesystem.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
          gateway: ${DOCKER_GATEWAY}
