# Overlay for the test environment (docs/development.md). It makes the test Caddy reuse the live
# stack's Let's Encrypt certificate instead of running ACME: the domain's HTTP-01 challenge can only
# reach one stack on this host, and the certificate is per-domain, so reusing it keeps the portal's
# Secure session cookie and the browser tests working with no code changes.
#
# Used only by the test checkout, which sets these in its .env:
#   COMPOSE_FILE=compose.yaml:compose.test.yaml
#   CADDYFILE=Caddyfile.test
#   LIVE_CERT_DIR=<live caddy certificate folder>
services:
  caddy:
    volumes:
      - ${LIVE_CERT_DIR}:/certs:ro
  # The test stack runs the formats image: the slow tier converts MOBI/AZW uploads to EPUB and reads
  # `.cb7` archives built with 7-Zip, so it needs the GPL/LGPL extras the permissive default lacks.
  # This tracked default keeps the test stack on `runtime-formats` without depending on the
  # untracked .env; the overlay wins because it is listed second in COMPOSE_FILE. Override either
  # default with COMPANION_BUILD_TARGET (see .env.example).
  kavita-companion:
    build:
      target: ${COMPANION_BUILD_TARGET:-runtime-formats}
