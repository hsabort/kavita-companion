# Build kavita-companion and publish it to GitHub Container Registry.
#
#   - version tags (vX.Y.Z): publish X.Y.Z, X.Y and latest
#   - pushes to main:        publish edge (plus a sha-<short> tag)
#   - pull requests:         build only, no push
#   - manual runs:           via workflow_dispatch
#
# Every build is scanned with Trivy before it is published: HIGH/CRITICAL vulnerabilities that have a
# fix fail the run, so the image never reaches GHCR, and the report is uploaded as a SARIF artifact
# (and to the Security tab where code scanning is on).
#
# The image is linux/amd64 only: the Dockerfile ships the x64 7-Zip build. The package is public, so
# it can be pulled (e.g. by docker compose) without logging in (docs/operations.md).
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write  # upload the Trivy SARIF to the Security tab (ignored on fork PRs)

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short

      - name: Build the image (loaded locally, not yet published)
        uses: docker/build-push-action@v6
        with:
          context: ./kavita-companion
          platforms: linux/amd64
          # Build into the local Docker store so the scan below runs before anything reaches GHCR: a
          # vulnerable image is never published. The push build further down publishes it once the scan
          # passes (attestations cannot be loaded locally, so they are added there).
          push: false
          load: true
          # Attestations cannot be loaded into the local store; the push build adds them.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set the image reference
        id: image
        run: echo "ref=ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Scan the image (SARIF for the Security tab / artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"

      - name: Upload the scan to the Security tab
        # Code scanning needs GitHub Advanced Security on a private repository, so this is allowed to
        # fail; the artifact below is kept either way.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Keep the scan as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Fail on HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Push the image
        # Only runs once the scan above passed, so a flagged image is never published. Attestations can
        # only travel with a registry push (the local Docker store cannot hold them), so this rebuilds
        # from the shared cache and pushes, adding the provenance and SBOM manifests.
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./kavita-companion
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true
