# Build checks for kavita-companion. The acceptance tests need a running Kavita stack, so they run
# against the test environment on the host (docs/development.md) rather than here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kavita-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kavita-companion/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check every dependency is permissively licensed
        run: npm run licences
      - name: Type-check and build (server + web bundle)
        run: npm run build

  docker:
    # Both image targets are built here, so a change that breaks either the permissive default or the
    # formats image that adds the GPL tools cannot merge (design §7.7). The assertions below run the
    # images: the default must not contain the GPL tools, and the formats image must contain them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the permissive (runtime) target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./kavita-companion/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: kavita-companion:ci-permissive
          cache-from: type=gha,scope=ci-companion-runtime
          cache-to: type=gha,mode=max,scope=ci-companion-runtime
      - name: Build the formats (runtime-formats) target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./kavita-companion/Dockerfile
          target: runtime-formats
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: kavita-companion:ci-formats
          cache-from: type=gha,scope=ci-companion-runtime-formats
          cache-to: type=gha,mode=max,scope=ci-companion-runtime-formats
      - name: Assert the GPL tools are in the formats image and nowhere else
        # One script run against each image, so the two checks cannot drift apart. It exits non-zero
        # on any mismatch: a bare `test` whose failure is not acted on would leave the container's
        # exit code at 0, so every failure is an explicit `exit 1`.
        run: |
          # shellcheck disable=SC2016
          # $EXPECT, $IMAGE and $path are expanded by the container's shell, not this one.
          check='
            for path in /usr/local/bin/7zzs /opt/kindleunpack; do
              if [ "$EXPECT" = absent ] && [ -e "$path" ]; then
                echo "unexpected $path in $IMAGE" >&2
                exit 1
              fi
              if [ "$EXPECT" = present ] && [ ! -e "$path" ]; then
                echo "missing $path in $IMAGE" >&2
                exit 1
              fi
            done
            echo "$IMAGE: GPL tools $EXPECT as expected"
          '
          docker run --rm --entrypoint /bin/sh -e EXPECT=absent  -e IMAGE=kavita-companion:ci-permissive kavita-companion:ci-permissive -c "$check"
          docker run --rm --entrypoint /bin/sh -e EXPECT=present -e IMAGE=kavita-companion:ci-formats    kavita-companion:ci-formats    -c "$check"

  default-image:
    # The permissive default image's refusals, kept separate from the `docker` job above (which builds
    # the formats image). The full suite, tests/test_default_image.py, runs over the HTTP stack on the
    # test host, because it needs Kavita — which GitHub-hosted runners do not have. What they can run
    # is the same file's `--image-only` mode: it drives the refusal logic inside the built `runtime`
    # image (the capability probe, the typed capability error, the archive dispatcher and the
    # MOBI/AZW3 Kindle conversion), so a change that re-admits 7-Zip or KindleUnpack to the default
    # image, or that breaks the capability message, fails here.
    #
    # What this job does NOT gate (accepted limitation, design §7.7): the HTTP wiring. The
    # completion-step refusal, its `upload_invalid` audit, the pending-area check and the preview 415
    # need the test host's Kavita/tus stack and run there, not here, via
    # `COMPANION_TEST_TARGET=runtime ./tests/run.sh --only test_default_image`. Do not read this job
    # as proving that row/audit/pending-area wiring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the permissive (runtime) target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./kavita-companion/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: kavita-companion:ci-permissive
          cache-from: type=gha,scope=ci-companion-runtime
          cache-to: type=gha,mode=max,scope=ci-companion-runtime
      - name: Run the default-image refusal suite
        env:
          COMPANION_IMAGE: kavita-companion:ci-permissive
        run: python3 tests/test_default_image.py --image-only
