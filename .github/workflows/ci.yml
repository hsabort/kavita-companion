# Build check for kavita-companion. The acceptance tests need a running Kavita stack, so they run
# against the test environment on the host (docs/development.md) rather than here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kavita-companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kavita-companion/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check and build (server + web bundle)
        run: npm run build
